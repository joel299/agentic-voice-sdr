# ==============================================================================
# RabbitMQ Dev Configuration - Agentic Voice SDR (ADR-002)
# ==============================================================================

# Load declarative topology definitions on startup
load_definitions = /etc/rabbitmq/definitions.json

# Default credentials and virtual host for development
default_user = guest
default_pass = guest
default_vhost = /

# Network listeners
listeners.tcp.default = 5672
management.tcp.port = 15672
