openapi: 3.1.0
info:
  title: Agentic Voice SDR API
  version: 1.0.0
  description: |
    Esta API permite configurar, testar e operar um agente de vendas por voz baseado em inteligência artificial. O agente interpreta o que o lead disse, decide o próximo passo comercial e gera uma resposta falada. A API permite ajustar e testar o comportamento antes de realizar chamadas reais.

    Com esta API você pode configurar o comportamento e as instruções do agente, escolher e ajustar a voz, configurar decisões comerciais, testar frases sem telefonar, ouvir o áudio gerado, medir o tempo de resposta, consultar o estado dos serviços, iniciar e acompanhar chamadas e consultar transcrições.

    Fluxo recomendado: (1) faça login; (2) consulte GET /v1/runtime/status para verificar o estado do sistema; (3) confira ou altere o prompt; (4) ajuste decisão comercial, voz e estilo de fala; (5) teste uma frase de lead; (6) confira a decisão e execute um teste de resposta do agente; (7) ouça o áudio; (8) ajuste configurações se necessário; (9) somente depois realize uma chamada real. Os testes sem chamada permitem avaliar intenção, próximo passo, latência, resposta gerada e áudio.

    O mecanismo de decisão comercial seleciona um próximo passo, como continuar, perguntar, tratar uma objeção, propor uma ação, fazer follow-up, encerrar ou solicitar atendimento humano. Em seguida, o modelo de voz gera a resposta. Isso separa estratégia comercial de personalidade, estilo, voz, ritmo e tom.

    Segurança: endpoints administrativos exigem autenticação Bearer. Senhas SIP e chaves de provedores nunca são retornadas. O perfil telefônico Fale Paco é gerenciado localmente. A credencial Fale Paco é gerenciada localmente e não pode ser modificada pela API. Use GET /v1/config/sip-trunk para consultar o perfil seguro e POST /v1/config/sip-trunk/validate para validar o registro sem fazer chamada.

    Primeiro faça login. O sistema fornecerá um token temporário. Use esse token no botão Authorize para acessar as configurações e testes administrativos. Para entrar, execute POST /v1/auth/login com o usuário owner e sua senha; copie access_token, clique em Authorize no Scalar e cole o token. Ao terminar, execute POST /v1/auth/logout. Reiniciar a API invalida as sessões interativas.

    Perfil Fale Paco: host e registrar 98034.falepaco.com.br, porta 5060, transporte TCP, usuário e realm 100 e 98034.falepaco.com.br, caller ID 551155200455, registro obrigatório. A credencial é gerenciada localmente e não pode ser modificada pela API; ela fica apenas no arquivo local protegido do runtime Baresip. A validação não envia INVITE nem retorna dados de autenticação SIP.

    Telefonia usa Baresip 1.1.0, ctrl_tcp e o adaptador de mídia local; não usa Asterisk, FreeSWITCH ou AudioSocket. WhatsApp e agendamento permanecem opcionais e podem ser disponibilizados futuramente. A documentação interativa Scalar está em /docs e o contrato OpenAPI completo em /openapi.yaml.
servers:
  - url: /
tags:
  - name: Authentication
    description: Login do owner e gerenciamento da sessão administrativa.
paths:
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: ownerLogin
      summary: Login
      description: "Use este endpoint para entrar no console administrativo. Após o login, copie o access_token retornado e informe-o no botão Authorize do Scalar."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerLoginRequest' }
            example: { username: owner, password: YOUR_PASSWORD }
      responses:
        '200':
          description: Token temporário de sessão; ele não é armazenado em texto puro no servidor.
          headers: { Cache-Control: { schema: { type: string }, example: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerLoginResponse' }
              example: { access_token: example-temporary-token, token_type: Bearer, expires_in: 28800, expires_at: '2026-10-02T03:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Username ou senha inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: invalid credentials } } } }
        '429': { description: Muitas tentativas de login; aguarde até um minuto antes de tentar novamente., headers: { Retry-After: { schema: { type: integer }, example: 60 } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getOwnerSession
      summary: Current Session
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Sessão autenticada sem expor credenciais, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: ownerLogout
      summary: Logout
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Sessão interativa revogada.
          content:
            application/json:
              schema:
                type: object
                required: [logged_out]
                properties: { logged_out: { type: boolean } }
              example: { logged_out: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/calls:
    post:
      operationId: createOutboundCall
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallCreateRequest' }
      responses:
        '202': { description: Call accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Call' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Destination is not in the configured allowlist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Registration or single-active-call gate rejected the request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { $ref: '#/components/responses/RuntimeFailure' }
        '503': { description: Call control is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/calls/{call_id}:
    get:
      operationId: getOutboundCall
      security:
        - BearerAuth: []
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Current call lifecycle, content: { application/json: { schema: { $ref: '#/components/schemas/Call' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Call not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { $ref: '#/components/responses/RuntimeFailure' }
  /v1/calls/{call_id}/hangup:
    post:
      operationId: hangupOutboundCall
      security:
        - BearerAuth: []
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Hangup command accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Call' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Call not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Call is not active or hangup was already requested, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { $ref: '#/components/responses/RuntimeFailure' }
  /v1/calls/{call_id}/transcript:
    get:
      operationId: getCallTranscript
      description: Returns persisted final lead and agent transcript turns in sequence order. An omitted limit defaults to 100; values above 500 are capped at 500. Interim and partial turns are never returned.
      security:
        - BearerAuth: []
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, description: Maximum returned final turns. Defaults to 100. Values above 500 are capped at 500., schema: { type: integer, minimum: 1, default: 100 } }
      responses:
        '200': { description: Call status and bounded final transcript; an existing call with no final turns returns an empty turns array, content: { application/json: { schema: { $ref: '#/components/schemas/CallTranscriptResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Call not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Transcript query failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/config/whatsapp:
    put:
      operationId: configureWhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppConfigRequest' }
      responses:
        '200': { description: Safe configuration, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
    get:
      operationId: getWhatsApp
      responses:
        '200': { description: Safe configuration, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/config/whatsapp/instances:
    get:
      operationId: listWhatsAppInstances
      responses:
        '200': { description: Provider instances, content: { application/json: { schema: { type: object, required: [instances], properties: { instances: { type: array, items: { $ref: '#/components/schemas/WhatsAppInstance' } } } } } } }
        '502': { $ref: '#/components/responses/ProviderFailure' }
  /v1/config/whatsapp/instance:
    put:
      operationId: selectWhatsAppInstance
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [instance_id], properties: { instance_id: { type: string, minLength: 1 } } }
      responses:
        '200': { description: Selected safe configuration, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/config/whatsapp/test:
    post:
      operationId: testWhatsApp
      description: Validates the configured provider and active instance; sends no message. Body is intentionally empty.
      responses:
        '200': { description: Test result }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
  /v1/config/sip-trunk:
    get:
      operationId: getFalePacoSIPProfile
      tags: [Fale Paco telephony]
      summary: Read the effective Fale Paco Baresip profile
      description: Returns the server-controlled canonical profile and whether a password is configured. The password and SIP authentication material are never returned. The Fale Paco credential is managed locally and cannot be modified through the API.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Effective safe Fale Paco profile, content: { application/json: { schema: { $ref: '#/components/schemas/FalePacoSIPProfile' }, example: { provider: 'Fale Paco', host: '98034.falepaco.com.br', port: 5060, transport: tcp, registrar: '98034.falepaco.com.br', outbound_proxy: '98034.falepaco.com.br:5060', auth: { type: userpass, username: '100', realm: '98034.falepaco.com.br' }, from_user: '100', from_domain: '98034.falepaco.com.br', caller_id: '551155200455', registration_required: true, enabled: true, password_configured: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Baresip profile unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/config/sip-trunk/validate:
    post:
      operationId: validateFalePacoRegistration
      tags: [Fale Paco telephony]
      summary: Validate Fale Paco registration without making a call
      description: Reports safe credential presence, canonical domain and username matches, TCP transport, registration requirement, and current Baresip registration state. Does not return password or SIP authentication digests and does not send an INVITE.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: No-call registration readiness, content: { application/json: { schema: { $ref: '#/components/schemas/FalePacoSIPValidation' }, example: { ok: true, password_configured: true, credential_present: true, domain_match: true, username_match: true, realm_match: true, transport: tcp, registration_required: true, registration_state: REGISTERED } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/RuntimeFailure' }
  /api/v1/agent/prompt:
    get:
      tags: [Owner prompt]
      operationId: getActiveAgentPrompt
      summary: Read the active immutable agent prompt
      description: Returns the current active prompt version from the existing PostgreSQL prompt repository. New Gemini sessions snapshot it exactly once; changing the active prompt does not change an already-started session.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Active prompt, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No active prompt is configured }
    put:
      tags: [Owner prompt]
      operationId: createAndActivateAgentPrompt
      summary: Create and activate a new prompt version
      description: Creates a new immutable version using the existing PromptService and PostgreSQL repository, then activates that version. History is retained; older versions are never overwritten. Only sessions started afterward use this snapshot.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        description: Prompt identity and commercial instructions; do not put secrets or voice prosody settings here.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptDraft' }
            examples:
              Consultative SDR:
                value: { name: 'Joel SDR Voice V1', prompt: 'Conduza uma conversa consultiva em português brasileiro. Faça uma pergunta por vez. Não invente preço, agenda, resultados nem capacidades.' }
      responses:
        '201': { description: New active immutable version, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
  /api/v1/agent/prompt/versions:
    get:
      tags: [Owner prompt]
      operationId: listAgentPromptVersions
      summary: List immutable prompt history
      description: Returns all stored versions newest first, including active state and timestamps. This is read-only and does not change running session snapshots.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Prompt versions, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/prompt/versions/{version}/activate:
    post:
      tags: [Owner prompt]
      operationId: activateAgentPromptVersion
      summary: Activate an existing prompt version
      description: Activates the requested immutable historical version for sessions created after this request. Already-running Gemini sessions keep their frozen snapshot.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: version, in: path, required: true, description: Positive immutable version number from the versions endpoint., schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Activated prompt, content: { application/json: { schema: { $ref: '#/components/schemas/PromptVersion' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Version does not exist }
  /v1/config/jev:
    get:
      tags: [Owner tuning]
      operationId: getJEVConfig
      summary: Read safe JEV tuning
      description: Returns process-local model, behavior description, owner guidance, configured_timeout_ms and canonical_default_timeout_ms (1500). Values reset to defaults on API restart. OPENROUTER_API_KEY is read only from the local environment and is never returned.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Safe JEV settings, content: { application/json: { schema: { $ref: '#/components/schemas/JEVConfig' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Owner tuning]
      operationId: updateJEVConfig
      summary: Update bounded JEV behavior tuning
      description: Updates the model and calibration text in process memory for future decisions; values reset to defaults on API restart. timeout_ms accepts 50–5000 ms; the canonical default is 1500 ms. Larger values can reduce false timeouts while increasing turn latency. Intent/action/reason enums, opt-out handling, tools, and hard safety rules are server controlled. JEV chooses what to do, not what to say. API keys are not accepted.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        description: All fields are required; unknown fields are rejected.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JEVConfigUpdate' }
            examples:
              Recommended:
                value: { model: 'typesafe/jev-1.13', timeout_ms: 1500, description: 'Classificador comercial SDR responsável por selecionar a próxima ação.', decision_guidance: 'Classifique semanticamente o último turno FINAL e selecione a próxima ação comercial.' }
      responses:
        '200': { description: Applied JEV settings, content: { application/json: { schema: { $ref: '#/components/schemas/JEVConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid model, field length, or timeout bound }
  /v1/config/gemini:
    get:
      tags: [Owner tuning]
      operationId: getGeminiConfig
      summary: Read safe Gemini Live voice settings
      description: Reads process-local model, prebuilt voice name, voice description, and delivery style. Values reset to defaults on API restart. The description and style are appended to a clearly delimited section of the frozen system instruction. No speech_metadata field is sent to Gemini Live.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Safe Gemini settings, content: { application/json: { schema: { $ref: '#/components/schemas/GeminiConfig' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Owner tuning]
      operationId: updateGeminiConfig
      summary: Update Gemini Live voice settings
      description: Tunes how generated speech sounds for sessions/tests created after this update; settings live in process memory and reset to defaults on API restart. model selects Gemini Live; voice_name maps to generationConfig.speechConfig.voiceConfig.prebuiltVoiceConfig.voiceName; description and style are frozen into the system instruction. Do not put product facts, pricing, JEV rules, calendar data, tools, or secrets in style. Test-only overrides are not persisted.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeminiConfig' }
            examples:
              Consultivo: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz comercial brasileira, humana e consultiva.', style: 'Calmo e confiante. Ritmo moderado. Frases curtas.' } }
              Executivo: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz profissional clara e segura.', style: 'Objetivo e seguro. Ritmo moderado, sem pressa. Preserve pausas naturais.' } }
              Acolhedor: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz cordial e atenta.', style: 'Próximo e cordial. Demonstre atenção ao lead sem soar ensaiado.' } }
              Calmo: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz serena e confiável.', style: 'Calmo, ritmo moderado, sem entusiasmo exagerado.' } }
              Objetivo: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz direta e profissional.', style: 'Frases curtas, dicção clara e uma pergunta por vez.' } }
              Moderadamente energético: { value: { model: 'gemini-3.8-live', voice_name: 'Kore', description: 'Voz brasileira positiva, sem tom publicitário.', style: 'Energia moderada e natural. Sem urgência ou entusiasmo exagerado.' } }
      responses:
        '200': { description: Applied safe settings, content: { application/json: { schema: { $ref: '#/components/schemas/GeminiConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid model, voice name, or field length }
  /v1/test/jev:
    post:
      tags: [No-call diagnostics]
      operationId: testJEVDecision
      summary: Run one real JEV semantic classification without a call
      description: Sends one bounded lead_text to the configured real OpenRouter JEV. stage defaults to active and must be opening, active, closing, or ended. Returns only the safe typed intent, canonical action/reason, latency, timeout, and provider class. No raw provider payload, headers, credentials, or hidden reasoning are returned. JEV does not generate spoken copy.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosticLeadRequest' }
            examples:
              Acceptance: { value: { lead_text: 'Sim, podemos marcar uma conversa para conhecer melhor.' } }
              Internal Alignment: { value: { lead_text: 'Preciso conversar com meu sócio primeiro.' } }
              Future Follow-up: { value: { lead_text: 'Me chama semana que vem.' } }
              Cost Objection: { value: { lead_text: 'O investimento ficou acima do que eu esperava.' } }
              Security Objection: { value: { lead_text: 'Tenho preocupação com LGPD e segurança.' } }
              Rejection: { value: { lead_text: 'Obrigado, mas não tenho interesse.' } }
              Opt-out: { value: { lead_text: 'Por favor, não entre mais em contato.' } }
              Human Request: { value: { lead_text: 'Quero falar com uma pessoa.' } }
              Clarification: { value: { lead_text: 'Como funciona esse serviço?' } }
              Capability Request: { value: { lead_text: 'Vocês integram com meu CRM?' } }
      responses:
        '200': { description: Safe semantic result; no side effects beyond one provider classification, content: { application/json: { schema: { $ref: '#/components/schemas/JEVTestResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Unsupported conversation stage }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '504': { description: JEV exceeded configured timeout }
  /v1/test/agent-turn:
    post:
      tags: [No-call diagnostics]
      operationId: testAgentTurn
      summary: Run one real JEV-to-Gemini turn without telephony
      description: Performs one real JEV classification, builds the canonical TurnDirective, snapshots the active immutable prompt exactly once, then runs Gemini Live with the frozen voice configuration. Passes only when actual output transcription, PCM 24 kHz audio, generationComplete, and turnComplete are observed. Does not use SIP, Baresip, INVITE, or a call record. description/style request fields are temporary overrides and are not persisted. Raw PCM is retained in memory only for at most 15 minutes, bounded to 8 tests and 24 MiB total.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTurnRequest' }
            examples:
              Privacy question: { value: { lead_text: 'Tenho preocupação com LGPD.' } }
      responses:
        '200': { description: Actual output transcription, lifecycle timings, and ephemeral audio link, content: { application/json: { schema: { $ref: '#/components/schemas/AgentTurnResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
        '504': { description: Provider test exceeded its time limit }
  /v1/test/agent-turn/{test_id}/audio:
    get:
      tags: [No-call diagnostics]
      operationId: getAgentTurnAudio
      summary: Read an ephemeral diagnostic WAV
      description: Returns the actual Gemini PCM as mono signed 16-bit little-endian WAV at 24 kHz. This is generated diagnostic audio, not a call recording. The in-memory artifact expires within 15 minutes and is not persisted to PostgreSQL.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: test_id, in: path, required: true, description: Test identifier returned from agent-turn., schema: { type: string } }
      responses:
        '200': { description: Mono PCM 24 kHz WAV, content: { audio/wav: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Missing or expired ephemeral audio }
  /v1/runtime/status:
    get:
      tags: [Owner diagnostics]
      operationId: getRuntimeReadiness
      summary: Read safe local runtime readiness
      description: Reads Baresip ctrl_tcp registration state, active prompt identity, and configured provider model/voice readiness. Returns no credentials, SIP account contents, or provider payloads. WhatsApp and scheduling are explicitly deferred and non-blocking.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Safe readiness metadata, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Runtime readiness could not be established }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid owner bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ProviderFailure: { description: Safe provider failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RuntimeFailure: { description: Safe telephony runtime failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    OwnerLoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, example: owner }
        password: { type: string, format: password, writeOnly: true, example: YOUR_PASSWORD }
    OwnerLoginResponse:
      type: object
      required: [access_token, token_type, expires_in, expires_at]
      properties:
        access_token: { type: string, description: Temporary opaque bearer token; copy to Scalar Authorize., example: example-temporary-token }
        token_type: { type: string, enum: [Bearer], example: Bearer }
        expires_in: { type: integer, example: 28800 }
        expires_at: { type: string, format: date-time, example: '2026-10-02T03:00:00Z' }
    OwnerSession:
      type: object
      required: [authenticated, username, session_type]
      properties:
        authenticated: { type: boolean, example: true }
        username: { type: string, example: owner }
        session_type: { type: string, enum: [interactive, legacy], example: interactive }
        expires_at: { type: string, format: date-time }
    Error: { type: object, required: [error], properties: { error: { type: string, description: Safe summary; raw provider messages are omitted. }, provider_status_class: { type: string, description: Optional sanitized provider operation/transport category. } } }
    CallCreateRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to: { type: string, description: E.164 destination; normalized and checked against the server allowlist before dialing, example: '+5567981340687' }
    Call:
      type: object
      required: [call_id, to, status, ai_runtime_status, ai_runtime_stage]
      properties:
        call_id: { type: string, description: API lifecycle identifier }
        provider_call_id: { type: string, description: Baresip runtime CallID when observed }
        to: { type: string }
        status: { type: string, enum: [dialing, ringing, connected, completed, busy, no_answer, failed, canceled] }
        terminal_reason: { type: string, pattern: '^(local_hangup|normal|busy|no_answer|canceled|failed|unknown|transport_error|sip_[45][0-9]{2})$', description: Sanitized provider close category or SIP status code; never includes raw SIP headers or credentials. }
        ai_runtime_status: { type: string, enum: [not_started, starting, running, failed, degraded, stopped], description: AI state is independent from SIP call status; failed/degraded does not dispatch Hangup. }
        ai_runtime_stage: { type: string, enum: [not_started, runtime_starting, jev_config, jev_client_init, prompt_snapshot, gemini_input_connect, gemini_response_connect, conversation_state, turn_runtime_init, bridge_init, bridge_run, media_ingress, input_transcription_send, input_transcription_receive, input_transcription_handler, jev_provider, turn_directive, gemini_response_send, gemini_response_receive, media_egress, turn_complete, degraded_mode, runtime_shutdown, runtime_unknown], description: Last safe runtime stage or the stage that failed. }
        ai_failure_class: { type: string, enum: [timeout, canceled, receive_failed, provider_api, media_closed, runtime_error, session_ended, jev_config, jev_client_init, prompt_snapshot, gemini_input_connect, gemini_response_connect, conversation_state, turn_runtime_init, bridge_init, media_ingress, input_transcription_send, input_transcription_receive, jev_provider, turn_directive, gemini_response_send, gemini_response_receive, media_egress, provider_transport, runtime_unknown], description: Sanitized failure category only; provider payloads are never returned. }
        ai_failure_at: { type: string, format: date-time, nullable: true, description: Timestamp of the AI runtime failure. }
        audio_error_seen: { type: boolean, description: Whether a correlated Baresip AUDIO_ERROR was observed; diagnostics are retained for the API process lifetime. }
        audio_error_at: { type: string, format: date-time }
        audio_error_class: { type: string, enum: [audio_buffer_limit, frame_protocol, peer_closed, socket_io, audio_device], description: Fixed safe class; no provider message or audio payload. }
        gemini_audio_first_at: { type: string, format: date-time }
        media_egress_first_at: { type: string, format: date-time }
        call_failed_at: { type: string, format: date-time }
        call_closed_at: { type: string, format: date-time }
    CallTranscriptResponse:
      type: object
      required: [call_id, status, turns]
      additionalProperties: false
      properties:
        call_id: { type: string }
        status: { type: string, enum: [dialing, ringing, connected, completed, busy, no_answer, failed, canceled] }
        turns: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/TranscriptTurn' } }
    TranscriptTurn:
      type: object
      required: [sequence, role, text, created_at]
      additionalProperties: false
      properties:
        sequence: { type: integer, minimum: 1 }
        role: { type: string, enum: [lead, agent] }
        text: { type: string }
        created_at: { type: string, format: date-time }
    WhatsAppConfigRequest:
      type: object
      required: [provider, base_url, credential]
      properties:
        provider: { type: string }
        base_url: { type: string, format: uri }
        credential: { type: string, writeOnly: true }
    WhatsAppConfig:
      type: object
      required: [provider, base_url, credential_configured, sdr_status]
      properties:
        provider: { type: string }
        base_url: { type: string, format: uri }
        credential_configured: { type: boolean }
        active_instance_id: { type: string }
        active_instance_phone: { type: string }
        provider_status: { type: string }
        sdr_status: { type: string }
        last_verified_at: { type: string, format: date-time }
    WhatsAppInstance:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        status: { type: string, enum: [CONNECTED, READY, DISCONNECTED] }
    FalePacoSIPProfile:
      type: object
      additionalProperties: false
      required: [provider, host, port, transport, registrar, outbound_proxy, auth, from_user, from_domain, caller_id, registration_required, enabled, password_configured]
      description: Canonical server-controlled Fale Paco profile. The only owner-supplied value is its write-only password; no codecs are advertised here because Baresip uses its configured runtime defaults.
      properties:
        provider: { type: string, const: 'Fale Paco', description: Provider is fixed by the server. }
        host: { type: string, const: '98034.falepaco.com.br' }
        port: { type: integer, const: 5060 }
        transport: { type: string, const: tcp }
        registrar: { type: string, const: '98034.falepaco.com.br' }
        outbound_proxy: { type: string, const: '98034.falepaco.com.br:5060' }
        auth: { type: object, required: [type, username, realm], properties: { type: { type: string, const: userpass }, username: { type: string, const: '100' }, realm: { type: string, const: '98034.falepaco.com.br' } } }
        from_user: { type: string, const: '100' }
        from_domain: { type: string, const: '98034.falepaco.com.br' }
        caller_id: { type: string, const: '551155200455' }
        registration_required: { type: boolean, const: true }
        enabled: { type: boolean, const: true }
        password_configured: { type: boolean, description: Whether a valid canonical account credential is present in protected local runtime storage. }
    FalePacoSIPValidation:
      type: object
      required: [ok, password_configured, credential_present, domain_match, username_match, realm_match, transport, registration_required, registration_state]
      properties:
        ok: { type: boolean }
        password_configured: { type: boolean }
        credential_present: { type: boolean }
        domain_match: { type: boolean }
        username_match: { type: boolean }
        realm_match: { type: boolean, description: True only when Baresip reports the Fale Paco registration as registered. }
        transport: { type: string, const: tcp }
        registration_required: { type: boolean, const: true }
        registration_state: { type: string }
    PromptDraft:
      type: object
      additionalProperties: false
      required: [name, prompt]
      properties:
        name: { type: string, maxLength: 120, description: Human-readable prompt version name, example: 'Joel SDR Voice V1' }
        prompt: { type: string, maxLength: 32768, description: Immutable commercial persona, rules, and guardrails for Gemini sessions. }
    PromptVersion:
      type: object
      required: [version, name, prompt, is_active, created_at]
      properties:
        version: { type: integer, minimum: 1, description: Immutable prompt version number. }
        name: { type: string, description: Version name. }
        prompt: { type: string, description: Stored prompt content. }
        is_active: { type: boolean, description: Whether new sessions snapshot this version. }
        created_at: { type: string, format: date-time, description: Creation timestamp. }
        activated_at: { type: [string, 'null'], format: date-time, description: Most recent activation timestamp when available. }
    PromptVersionList:
      type: object
      required: [versions]
      properties:
        versions: { type: array, items: { $ref: '#/components/schemas/PromptVersion' } }
    JEVConfigUpdate:
      type: object
      additionalProperties: false
      required: [model, timeout_ms, description, decision_guidance]
      properties:
        model: { type: string, minLength: 1, maxLength: 160, description: OpenRouter JEV model identifier. }
        timeout_ms: { type: integer, minimum: 50, maximum: 5000, default: 1500, description: Provider decision deadline in milliseconds; canonical default is 1500 ms. }
        description: { type: string, maxLength: 2000, description: Classifier role description; it does not generate spoken copy. }
        decision_guidance: { type: string, maxLength: 4000, description: Additional owner calibration guidance. Canonical enums and safety rules remain server controlled. }
    JEVConfig:
      allOf:
        - { $ref: '#/components/schemas/JEVConfigUpdate' }
        - type: object
          required: [configured_timeout_ms, canonical_default_timeout_ms]
          properties:
            configured_timeout_ms: { type: integer, description: Currently configured per-decision timeout. }
            canonical_default_timeout_ms: { type: integer, const: 1500, description: Canonical JEV default; not changed by owner tuning. }
    GeminiConfig:
      type: object
      additionalProperties: false
      required: [model, voice_name, description, style]
      properties:
        model: { type: string, minLength: 1, maxLength: 160, description: Gemini Live model identifier. }
        voice_name: { type: string, minLength: 1, maxLength: 80, description: Prebuilt voice mapped to generationConfig.speechConfig.voiceConfig. }
        description: { type: string, maxLength: 2000, description: Desired overall character of the generated voice. }
        style: { type: string, maxLength: 4000, description: Prosody and delivery guidance only; do not put product claims, JEV rules, calendar facts, tool instructions, or secrets here. }
    DiagnosticLeadRequest:
      type: object
      additionalProperties: false
      required: [lead_text]
      properties:
        lead_text: { type: string, minLength: 1, maxLength: 8192, description: One bounded test utterance; common contact identifiers are sanitized before JEV. }
        stage: { type: string, enum: [opening, active, closing, ended], default: active, description: Conversation lifecycle stage; defaults to active. }
    AgentTurnRequest:
      type: object
      additionalProperties: false
      required: [lead_text]
      properties:
        lead_text: { type: string, minLength: 1, maxLength: 8192, description: One bounded test utterance; common contact identifiers are sanitized before JEV. }
        description: { type: string, maxLength: 2000, description: Temporary voice description override for this test only; not persisted. }
        style: { type: string, maxLength: 4000, description: Temporary voice style override for this test only; not persisted. }
    JEVTestResult:
      type: object
      required: [intent, next_action, reason, latency_ms, timeout_ms, provider_status_class]
      properties:
        intent: { type: string, enum: [acceptance, indecision_cost, indecision_security, internal_alignment, explicit_future_follow_up, rejection, opt_out, human_request, clarification_or_information_request, capability_request, neutral_continue], description: Validated canonical semantic intent. }
        next_action: { type: string, enum: [continue_conversation, ask_question, propose_scheduling, request_capability, follow_up, end_conversation, handoff], description: Canonical server-validated next action. }
        reason: { type: string, enum: [needs_clarification, continue_discovery, interest_confirmed, ready_to_schedule, conversation_complete, follow_up_required, capability_required, handoff_required], description: Canonical server-validated reason. }
        latency_ms: { type: integer, minimum: 0, description: End-to-end local elapsed provider decision time in milliseconds. }
        timeout_ms: { type: integer, description: Applied JEV timeout in milliseconds. }
        provider_status_class: { type: string, enum: [ok], description: Safe provider result class; provider payloads are never returned. }
    AgentTurnResult:
      type: object
      required: [test_id, prompt, jev, gemini, audio_url]
      properties:
        test_id: { type: string, description: Ephemeral test identifier. }
        prompt: { type: object, required: [name, version], properties: { name: { type: string }, version: { type: integer } }, description: Frozen prompt snapshot identity. }
        jev: { $ref: '#/components/schemas/JEVTestResult' }
        gemini:
          type: object
          required: [output_transcription, first_audio_ms, last_audio_ms, turn_complete_ms, total_turn_ms, generation_complete, turn_complete, audio_event_count, audio_bytes_total, transport_class]
          properties:
            output_transcription: { type: string, description: Actual Gemini output transcription; never synthesized by the API. }
            first_audio_ms: { type: integer, description: Milliseconds until first actual audio part. }
            last_audio_ms: { type: integer, description: Milliseconds until last actual audio part. }
            turn_complete_ms: { type: integer, description: Milliseconds until turnComplete. }
            total_turn_ms: { type: integer, description: Total Gemini turn duration in milliseconds. }
            generation_complete: { type: boolean, description: Whether generationComplete diagnostic event was observed. }
            turn_complete: { type: boolean, description: Whether turnComplete was observed; required for pass. }
            audio_event_count: { type: integer, description: Number of Gemini audio parts. }
            audio_bytes_total: { type: integer, description: Total transient PCM bytes. }
            transport_class: { type: string, description: Safe transport class, without raw provider text. }
        audio_url: { type: string, description: Relative owner-authenticated URL to transient mono PCM16 WAV at 24 kHz. }
    RuntimeStatus:
      type: object
      required: [api_ready, baresip_ctrl_ready, baresip_registered, prompt_active, jev_configured, jev_model, jev_timeout_ms, gemini_configured, gemini_model, gemini_voice_name, whatsapp_status, scheduling_status]
      properties:
        api_ready: { type: boolean }
        baresip_ctrl_ready: { type: boolean, description: Baresip ctrl_tcp registration query responded. }
        baresip_registered: { type: boolean, description: Current Baresip SIP registration state. }
        prompt_active: { type: boolean }
        prompt_name: { type: string }
        prompt_version: { type: integer }
        jev_configured: { type: boolean }
        jev_model: { type: string }
        jev_timeout_ms: { type: integer }
        gemini_configured: { type: boolean }
        gemini_model: { type: string }
        gemini_voice_name: { type: string }
        whatsapp_status: { type: string, const: deferred }
        scheduling_status: { type: string, const: deferred }
